name: Actualizar productos

on:
  schedule:
    # Todos los días a las 6:17 de Argentina (9:17 UTC)
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      solo:
        description: "Solo estos proveedores (ids separados por coma). Vacío = todos."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  colectar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # siempre la versión más reciente del código

      - name: Traer los datos de la última carga
        run: |
          if git fetch -q --depth=1 origin datos; then
            git show FETCH_HEAD:productos.json > docs/productos.json
            echo "Datos anteriores tomados de la rama datos"
          else
            echo "Todavía no hay rama datos: se usa docs/productos.json del repositorio"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probar el colector
        run: python -m unittest colector/test_colectar.py

      - name: Instalar navegador automático (para webs que cargan con JavaScript)
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Traer productos de los proveedores
        env:
          CLAVE_LAXSHI: ${{ secrets.CLAVE_LAXSHI }}
          CLAVE_OESTECH: ${{ secrets.CLAVE_OESTECH }}
        run: |
          if [ -n "${{ github.event.inputs.solo }}" ]; then
            python colector/colectar.py --solo "${{ github.event.inputs.solo }}"
          else
            python colector/colectar.py
          fi

      - name: Publicar en la rama datos (se reemplaza entera, así el repositorio no crece)
        run: |
          mkdir -p /tmp/sitio
          cp -r docs/. /tmp/sitio/
          touch /tmp/sitio/.nojekyll
          cd /tmp/sitio
          git init -q -b datos
          git config user.name "buscador-bot"
          git config user.email "buscador-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Productos $(date -u +%Y-%m-%d)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos
          echo "Publicado: $(du -h productos.json | cut -f1) de datos"
